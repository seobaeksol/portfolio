name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build portfolio
        run: npm run build

      - name: Render static GitHub Pages bundle
        env:
          PAGES_SOURCE_URL: http://127.0.0.1:3001/
        run: |
          npx vinext start --host 127.0.0.1 --port 3001 > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run pages:export
          kill "$server_pid" || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
